# RustDesk 1.3.7 - Flutter/Rust bridge generator
# Windows x64 workflow companion.
# Fixes the stale rustdesk-org/request git revision recorded in Cargo.lock.

name: Build flutter-rust-bridge

on:
  workflow_call:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.75"

jobs:
  generate_bridge:
    name: generate_bridge (ubuntu-22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ca-certificates \
            clang \
            cmake \
            curl \
            gcc \
            g++ \
            git \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu-22.04-v2

      - name: Cache generated bridge
        id: cache-bridge
        uses: actions/cache@v4
        with:
          path: /tmp/flutter_rust_bridge
          key: rustdesk-1.3.7-bridge-ubuntu-22.04-v2

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge dependencies
        shell: bash
        run: |
          cargo install flutter_rust_bridge_codegen \
            --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} \
            --features "uuid" \
            --locked

          pushd flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get
          popd

      # RustDesk 1.3.7's old Cargo.lock can contain a git SHA for
      # rustdesk-org/request that no longer exists on the remote.
      # Refresh only that package before flutter_rust_bridge invokes
      # cargo metadata.
      - name: Refresh stale Rust git dependency
        shell: bash
        run: |
          set -euxo pipefail

          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

          # Remove only cached checkouts/databases for the affected repository.
          rm -rf ~/.cargo/git/checkouts/request-* || true
          rm -rf ~/.cargo/git/db/request-* || true

          # The failing log identifies this dependency package as "request".
          # Updating it replaces the deleted SHA from Cargo.lock with a ref
          # currently available from the repository.
          cargo update -p request

          echo "Updated request dependency:"
          grep -n -A8 -B2 'name = "request"' Cargo.lock || true

      - name: Verify Cargo metadata
        shell: bash
        run: |
          cargo metadata --format-version 1 --no-deps > /tmp/rustdesk-cargo-metadata.json
          test -s /tmp/rustdesk-cargo-metadata.json

      - name: Generate Flutter/Rust bridge
        shell: bash
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

          cp \
            ./flutter/macos/Runner/bridge_generated.h \
            ./flutter/ios/Runner/bridge_generated.h

      - name: Verify generated files
        shell: bash
        run: |
          test -f ./src/bridge_generated.rs
          test -f ./src/bridge_generated.io.rs
          test -f ./flutter/lib/generated_bridge.dart
          test -f ./flutter/lib/generated_bridge.freezed.dart
          test -f ./flutter/macos/Runner/bridge_generated.h
          test -f ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error
